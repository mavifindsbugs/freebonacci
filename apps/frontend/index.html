<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Poker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    [x-cloak] { display: none !important; }
  </style>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col" x-data="pokerApp">

  <!-- Name Modal -->
  <div x-show="roomId && isNameModalOpen" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-[var(--color-surface-raised)] border border-[var(--color-surface-border)] p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4">
      <h2 class="text-2xl font-bold mb-2">Join Session</h2>
      <p class="text-[var(--color-muted)] text-sm mb-6">Enter your name to join the estimation room.</p>
      <input type="text" x-model="playerName" maxlength="16" @keydown.enter="submitName" class="w-full bg-[var(--color-surface)] border border-[var(--color-surface-border)] rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] text-white" placeholder="Your Name" autofocus>
      <button @click="submitName" class="w-full bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] text-white font-medium py-3 rounded-xl transition duration-200">Join Room</button>
    </div>
  </div>

  <!-- Landing Page -->
  <div x-show="!roomId" x-cloak class="flex-1 flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full">
    <div class="text-center mb-8">
      <h1 class="text-5xl font-bold tracking-tight text-[var(--color-accent)] mb-4">🃏 Poker</h1>
      <p class="text-[var(--color-muted)] text-lg">Real-time agile estimation</p>
    </div>

    <div class="bg-[var(--color-surface-raised)] border border-[var(--color-surface-border)] p-8 rounded-2xl shadow-2xl w-full">
      <div class="mb-6">
        <label class="block text-sm font-medium text-[var(--color-muted)] mb-2">Your Name</label>
        <input type="text" x-model="playerName" maxlength="16" class="w-full bg-[var(--color-surface)] border border-[var(--color-surface-border)] rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] text-white placeholder-[var(--color-muted)]" placeholder="John Doe">
      </div>
      
      <button @click="createRoom" class="w-full bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] text-white font-semibold py-3 rounded-xl transition duration-200 mb-8 shadow-lg">Create New Room</button>

      <div class="relative flex items-center justify-center mb-8">
        <div class="border-t border-[var(--color-surface-border)] w-full"></div>
        <span class="bg-[var(--color-surface-raised)] px-4 text-sm text-[var(--color-muted)] absolute">OR JOIN EXISTING</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-[var(--color-muted)] mb-2">Room ID</label>
        <input type="text" x-model="joinRoomId" @keydown.enter="joinRoom" class="w-full bg-[var(--color-surface)] border border-[var(--color-surface-border)] rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] text-white font-mono text-sm placeholder-[var(--color-muted)]" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
        <button @click="joinRoom" class="w-full bg-[var(--color-surface)] hover:bg-[var(--color-surface-border)] border border-[var(--color-surface-border)] text-white font-semibold py-3 rounded-xl transition duration-200">Join Room</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div class="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 md:p-6" x-show="roomId" x-cloak>
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center py-4 border-b border-[var(--color-surface-border)] gap-4">
      <div class="flex items-center gap-3">
        <a href="/" class="text-xl font-bold tracking-tight text-[var(--color-accent)] hover:text-[var(--color-accent-hover)] transition">🃏 Poker</a>
      </div>
      
      <div class="flex items-center gap-3">
        <select 
          x-model="gameState.deck" 
          @change="setDeck($event.target.value)"
          :disabled="voteCount > 0"
          :class="{ 'opacity-50 cursor-not-allowed': voteCount > 0 }"
          class="bg-[var(--color-surface-raised)] border border-[var(--color-surface-border)] text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[var(--color-accent)] transition-all"
        >
          <option value="fibonacci">Fibonacci</option>
          <option value="tshirt">T-Shirt</option>
        </select>
        <button @click="shareRoom" class="text-sm bg-[var(--color-surface-raised)] hover:bg-[var(--color-surface-border)] border border-[var(--color-surface-border)] px-3 py-2 rounded-lg font-medium transition flex justify-center items-center gap-2 whitespace-nowrap min-w-[110px]">
          <span x-show="!copied">📋 Share Link</span>
          <span x-show="copied" x-cloak class="text-[var(--color-success)]">✅ Copied!</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row my-8 md:my-12 gap-8 items-start">
      
      <!-- Action Area (Right Sidebar on Desktop, Top on Mobile) -->
      <div class="order-1 lg:order-2 w-full lg:w-80 flex-shrink-0 flex flex-col items-center gap-6 bg-[var(--color-surface-raised)] border border-[var(--color-surface-border)] rounded-2xl p-6 lg:p-8 shadow-xl lg:sticky lg:top-8 transition-all duration-300 mb-2 lg:mb-0">
        
        <!-- Stats Scoreboard (Always visible, changes state) -->
        <div class="w-full bg-[var(--color-surface)] border border-[var(--color-surface-border)] rounded-xl p-4 grid gap-4 shadow-inner h-[90px] items-center"
             :class="gameState.deck === 'fibonacci' ? 'grid-cols-2' : 'grid-cols-1'">
          <div class="text-center" x-show="gameState.deck === 'fibonacci'">
            <span class="text-[var(--color-muted)] text-xs uppercase tracking-wider block mb-1">Average</span>
            <span class="text-2xl font-bold transition-colors" 
                  :class="gameState.isRevealed ? 'text-white' : 'text-[var(--color-surface-border)]'"
                  x-text="gameState.isRevealed && gameState.lastRound?.average ? gameState.lastRound.average : '-.-'"></span>
          </div>
          <div class="text-center flex flex-col justify-center">
            <span class="text-[var(--color-muted)] text-xs uppercase tracking-wider block mb-1">Agreement</span>
            <span class="text-lg font-bold transition-colors" 
                  :class="!gameState.isRevealed ? 'text-[var(--color-surface-border)]' : {
                    'text-[var(--color-success)]': gameState.lastRound?.agreement === 'full',
                    'text-yellow-400': gameState.lastRound?.agreement === 'close',
                    'text-red-400': gameState.lastRound?.agreement === 'split'
                  }"
                  x-text="gameState.isRevealed && gameState.lastRound ? gameState.lastRound.agreement.toUpperCase() : '---'"></span>
          </div>
        </div>

        <div class="w-full flex justify-center">
          <button @click="revealVotes" x-show="!gameState.isRevealed" :disabled="voteCount === 0" class="w-full bg-[var(--color-accent)] border border-transparent text-white font-semibold px-6 py-4 rounded-xl shadow-lg hover:bg-[var(--color-accent-hover)] hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">Reveal Cards</button>
          <button @click="resetTable" x-show="gameState.isRevealed" class="w-full bg-[var(--color-surface)] border border-[var(--color-surface-border)] hover:bg-[var(--color-surface-border)] text-white font-semibold px-6 py-4 rounded-xl shadow-lg transition-all">Start New Round</button>
        </div>

        <p class="text-[var(--color-muted)] text-sm transition-colors">
          <span class="font-bold" :class="gameState.isRevealed ? 'text-[var(--color-muted)]' : 'text-white'" x-text="voteCount"></span> / <span x-text="eligibleCount"></span> voted
        </p>

        <!-- Round History -->
        <div class="w-full border-t border-[var(--color-surface-border)] pt-4 mt-2 flex flex-col gap-2 h-[150px] overflow-y-auto">
          <h3 class="text-xs uppercase tracking-wider text-[var(--color-muted)] mb-1">Previous Rounds</h3>
          
          <div x-show="gameState.history.length === 0" class="text-sm text-[var(--color-muted)] italic text-center py-4">
            No rounds played yet.
          </div>
          
          <div class="flex flex-col gap-1 pb-2">
            <template x-for="(round, index) in gameState.history" :key="round.timestamp">
              <div class="flex justify-between items-center bg-[var(--color-surface)] border border-[var(--color-surface-border)] rounded-md px-2 py-1.5 text-xs shadow-sm">
                <span class="text-[var(--color-muted)]">Round <span x-text="gameState.history.length - index"></span></span>
                <span class="font-bold text-white" x-text="round.average ? round.average : round.agreement.toUpperCase()"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Player Grid (Left on Desktop, Bottom on Mobile) -->
      <div class="order-2 lg:order-1 flex-1 w-full flex flex-wrap justify-center lg:justify-start gap-3 sm:gap-5">
        <template x-for="(player, id) in gameState.players" :key="id">
          <div class="w-24 sm:w-28 lg:w-32 bg-[var(--color-surface-raised)] border border-[var(--color-surface-border)] rounded-2xl p-2 sm:p-3 flex flex-col items-center justify-center aspect-[3/4] relative transition-all duration-300 shadow-lg"
               :class="{ 'ring-2 ring-[var(--color-success)]/50': player.vote !== null && !gameState.isRevealed }">
            
            <div class="flex-1 flex items-center justify-center w-full">
              <!-- Waiting for vote -->
              <div x-show="player.vote === null" class="text-[var(--color-muted)] flex flex-col items-center gap-2">
                <svg class="animate-spin h-6 w-6 opacity-50" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              </div>
              
              <!-- Voted, hidden -->
              <div x-show="player.vote !== null && !gameState.isRevealed" class="text-[var(--color-success)]">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              </div>
              
              <!-- Revealed -->
              <div x-show="player.vote !== null && gameState.isRevealed" 
                   x-text="player.vote" 
                   class="text-4xl font-bold text-white transition-all duration-500 scale-100">
              </div>
            </div>

            <div class="mt-auto pt-3 border-t border-[var(--color-surface-border)] w-full text-center">
              <span class="text-sm font-medium text-[var(--color-muted)] truncate block px-2" x-text="player.name"></span>
            </div>
          </div>
        </template>
        <!-- Spacer for fixed footer so last players aren't hidden -->
        <div class="w-full h-[200px] lg:h-[180px] flex-shrink-0"></div>
      </div>
    </main>

    <!-- Footer / Deck -->
    <footer class="fixed bottom-0 left-0 w-full pt-4 pb-6 px-4 bg-black/60 backdrop-blur-lg border-t border-[var(--color-surface-border)] z-40">
      <div class="flex flex-wrap justify-center gap-2 sm:gap-3 max-w-5xl mx-auto">
        <template x-for="card in activeDeckCards" :key="card">
          <button 
            @click="castVote(card)" 
            :disabled="gameState.isRevealed"
            class="w-16 sm:w-20 aspect-[2/3] bg-[var(--color-surface-raised)] border-2 hover:-translate-y-2 rounded-xl font-bold text-xl sm:text-2xl flex items-center justify-center shadow-lg transition duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0"
            :class="myVote === card ? 'border-[var(--color-accent)] text-[var(--color-accent)] bg-[var(--color-accent)]/10' : 'border-[var(--color-surface-border)] text-white hover:border-[var(--color-accent)]/50'"
            x-text="card"></button>
        </template>
      </div>
    </footer>
  </div>

</body>
</html>
